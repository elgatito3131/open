name: Product application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dwello:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dwello_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/dwello_test
    defaults:
      run:
        working-directory: projects/dwello
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: projects/dwello/package-lock.json
      - run: npm ci --no-fund
      - run: npm test
      - run: npm run build

  frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: frontier_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      FRONTIER_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/frontier_test
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: projects/frontier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: projects/frontier/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/frontier/requirements.lock
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock
      - run: ./test.sh
      - run: npm ci --no-fund
      - run: npm run build
      - run: npm run typecheck
