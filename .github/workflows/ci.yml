name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  array-observatory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        java: ['17', '21']
    defaults:
      run:
        working-directory: projects/array-observatory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and check the Java engine
        run: ./test.sh
